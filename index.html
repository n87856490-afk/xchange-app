<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Платформа обмена</title>
    <!-- Подключаем красивый шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Подключаем библиотеку для графика -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Подключаем Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            var(--primary-cyan): #06b6d4; 
            var(--primary-blue): #0284c7;
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #f8fafc;
            color: #1e293b; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Красивые фоновые круги */
        .bg-circles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .circle-1 {
            position: absolute;
            top: -10%; left: -20%;
            width: 300px; height: 300px;
            background: #06b6d4;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }
        .circle-2 {
            position: absolute;
            bottom: 10%; right: -20%;
            width: 250px; height: 250px;
            background: #0284c7;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.2;
        }

        .card { 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 26px 20px; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(2, 132, 199, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        /* Главное приветствие */
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { 
            font-size: 24px; 
            margin: 0 0 12px 0; 
            font-weight: 800; 
            line-height: 1.2;
            background: linear-gradient(135deg, #0284c7, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { 
            font-size: 13px; 
            margin: 0; 
            color: #64748b; 
            font-weight: 600;
            line-height: 1.4;
        }
        
        /* Контейнер графика */
        .chart-container {
            position: relative;
            height: 140px;
            width: 100%;
            margin-bottom: 24px;
        }

        /* Вкладки */
        .tabs { 
            display: flex; 
            background-color: #f1f5f9; 
            border-radius: 14px; 
            padding: 5px; 
            margin-bottom: 20px; 
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            border-radius: 10px; 
            color: #64748b; 
            transition: all 0.3s ease; 
        }
        .tab.active { 
            background: linear-gradient(135deg, #06b6d4, #0284c7); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3); 
        }
        
        /* Форма ввода */
        .form-group { margin-bottom: 16px; }
        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            margin-bottom: 6px; 
            color: #475569; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        select, input { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: #ffffff; 
            color: #0f172a;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        select:focus, input:focus { 
            outline: none; 
            border-color: #06b6d4;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
        }
        
        /* Блок результата */
        .result-box { 
            margin-top: 20px; 
            padding: 18px; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd; 
            border-radius: 16px; 
            text-align: center; 
            display: none; 
        }
        .result-box span { display: block; font-size: 12px; color: #0284c7; margin-bottom: 4px; font-weight: 700;}
        .result-box strong { font-size: 24px; color: #0284c7; font-weight: 800; }
    </style>
</head>
<body>
    <!-- Фоновые круги -->
    <div class="bg-circles">
        <div class="circle-1"></div>
        <div class="circle-2"></div>
    </div>

    <div class="card">
        <div class="header">
            <h1>МЕНЯЙ НАЛИЧКУ НА РУБЛИ И ЮАНИ</h1>
            <p>Покупаем и продаем за наличные<br>по самым выгодным курсам</p>
        </div>

        <!-- График -->
        <div class="chart-container">
            <canvas id="rateChart"></canvas>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-buy" onclick="switchMode('buy')">Купить</div>
            <div class="tab" id="tab-sell" onclick="switchMode('sell')">Продать</div>
        </div>

        <div class="form-group">
            <label>Активы для обмена</label>
            <select id="currency" onchange="changeCurrency()">
                <option value="USDT">Tether (USDT)</option>
                <option value="CNY">Китайский юань (CNY)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="label-amount">Отдаете (RUB)</label>
            <input type="number" id="amount" placeholder="Введите сумму..." oninput="calculate()" inputmode="decimal">
        </div>

        <div class="result-box" id="result-box">
            <span>Вы получаете:</span>
            <strong id="receive-text">0.00</strong>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.text = "ОТПРАВИТЬ ЗАЯВКУ";
        tg.MainButton.color = "#06b6d4";
        tg.MainButton.textColor = "#ffffff";

        let currentMode = 'buy';
        const rates = {
            buy: { USDT: 98.50, CNY: 13.60 },
            sell: { USDT: 95.00, CNY: 13.10 }
        };

        // НАСТРОЙКА ГРАФИКА
        const ctx = document.getElementById('rateChart').getContext('2d');
        let gradient = ctx.createLinearGradient(0, 0, 0, 140);
        gradient.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
        gradient.addColorStop(1, 'rgba(6, 182, 212, 0.0)');

        // Примерные данные для красоты графика (динамика за 7 дней)
        const mockDataUSDT = [96.5, 97.2, 97.0, 97.8, 98.1, 98.0, 98.5];
        const mockDataCNY = [13.2, 13.4, 13.3, 13.5, 13.6, 13.5, 13.6];

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Сегодня'],
                datasets: [{
                    label: 'Курс',
                    data: mockDataUSDT,
                    borderColor: '#06b6d4',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4, // Плавные изгибы
                    pointRadius: 0,
                    pointHitRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false }, // Скрываем сетку для чистоты
                    y: { display: false }
                },
                layout: { padding: 0 }
            }
        });

        // Смена валюты (обновляет график и расчеты)
        function changeCurrency() {
            const currency = document.getElementById('currency').value;
            // Анимация смены данных на графике
            chart.data.datasets[0].data = currency === 'USDT' ? mockDataUSDT : mockDataCNY;
            chart.update();
            calculate();
        }

        // Переключение Купить/Продать
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-buy').classList.toggle('active', mode === 'buy');
            document.getElementById('tab-sell').classList.toggle('active', mode === 'sell');
            document.getElementById('label-amount').innerText = mode === 'buy' ? "Отдаете (RUB)" : "Отдаете (USDT / CNY)";
            document.getElementById('amount').value = '';
            document.getElementById('result-box').style.display = 'none';
            tg.MainButton.hide();
        }

        // Расчет суммы
        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value);
            const currency = document.getElementById('currency').value;
            const resultBox = document.getElementById('result-box');
            const receiveText = document.getElementById('receive-text');

            if (isNaN(amount) || amount <= 0) {
                resultBox.style.display = 'none';
                tg.MainButton.hide();
                return;
            }

            let receiveAmount = currentMode === 'buy' ? amount / rates.buy[currency] : amount * rates.sell[currency];
            let receiveCurrency = currentMode === 'buy' ? currency : 'RUB';

            // Красивое форматирование чисел с пробелами
            let formattedAmount = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(receiveAmount);
            
            receiveText.innerText = formattedAmount + ' ' + receiveCurrency;
            resultBox.style.display = 'block';
            tg.MainButton.show();
        }

        // Отправка заявки в бота
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            const receiveAmountText = document.getElementById('receive-text').innerText;
            
            const data = {
                action: currentMode === 'buy' ? 'Покупка' : 'Продажа',
                currency: currency,
                amount_sent: amount,
                amount_received: receiveAmountText
            };
            
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
