<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Платформа обмена</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Основные сине-бирюзовые цвета */
            --primary-cyan: #06b6d4; 
            --primary-blue: #0284c7;
            --bg-gradient: linear-gradient(135deg, #ecfeff 0%, #e0f2fe 100%);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-gradient); 
            color: #1e293b; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }
        .card { 
            background-color: #ffffff; 
            padding: 26px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.08); 
        }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { 
            font-size: 22px; 
            margin: 0 0 6px 0; 
            font-weight: 700; 
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 14px; margin: 0; color: #64748b; }
        
        .tabs { 
            display: flex; 
            background-color: #f1f5f9; 
            border-radius: 14px; 
            padding: 5px; 
            margin-bottom: 24px; 
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            border-radius: 10px; 
            color: #64748b; 
            transition: all 0.3s ease; 
        }
        .tab.active { 
            background: linear-gradient(135deg, var(--primary-cyan), var(--primary-blue)); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3); 
        }
        
        .form-group { margin-bottom: 18px; }
        label { 
            display: block; 
            font-size: 12px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #475569; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        select, input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #e2e8f0; 
            border-radius: 14px; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: #f8fafc; 
            color: #0f172a;
            transition: all 0.2s ease;
        }
        select:focus, input:focus { 
            outline: none; 
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
        }
        
        .result-box { 
            margin-top: 24px; 
            padding: 18px; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 1px solid #bae6fd; 
            border-radius: 14px; 
            text-align: center; 
            display: none; 
        }
        .result-box span { display: block; font-size: 13px; color: #0284c7; margin-bottom: 4px; font-weight: 600;}
        .result-box strong { font-size: 26px; color: var(--primary-blue); }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Обмен Валют</h1>
            <p>Быстро, безопасно, выгодно</p>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-buy" onclick="switchMode('buy')">Купить</div>
            <div class="tab" id="tab-sell" onclick="switchMode('sell')">Продать</div>
        </div>

        <div class="form-group">
            <label>Активы для обмена</label>
            <select id="currency" onchange="calculate()">
                <option value="USDT">Tether (USDT)</option>
                <option value="CNY">Китайский юань (CNY)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="label-amount">Отдаете (RUB)</label>
            <input type="number" id="amount" placeholder="Введите сумму..." oninput="calculate()" inputmode="decimal">
        </div>

        <div class="result-box" id="result-box">
            <span>Вы получаете:</span>
            <strong id="receive-text">0.00</strong>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Цвет главной кнопки Telegram теперь бирюзовый
        tg.MainButton.text = "ОТПРАВИТЬ ЗАЯВКУ";
        tg.MainButton.color = "#06b6d4";
        tg.MainButton.textColor = "#ffffff";

        let currentMode = 'buy';
        const rates = {
            buy: { USDT: 98.50, CNY: 13.60 },
            sell: { USDT: 95.00, CNY: 13.10 }
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-buy').classList.toggle('active', mode === 'buy');
            document.getElementById('tab-sell').classList.toggle('active', mode === 'sell');
            document.getElementById('label-amount').innerText = mode === 'buy' ? "Отдаете (RUB)" : "Отдаете (USDT / CNY)";
            document.getElementById('amount').value = '';
            document.getElementById('result-box').style.display = 'none';
            tg.MainButton.hide();
        }

        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value);
            const currency = document.getElementById('currency').value;
            const resultBox = document.getElementById('result-box');
            const receiveText = document.getElementById('receive-text');

            if (isNaN(amount) || amount <= 0) {
                resultBox.style.display = 'none';
                tg.MainButton.hide();
                return;
            }

            let receiveAmount = currentMode === 'buy' ? amount / rates.buy[currency] : amount * rates.sell[currency];
            let receiveCurrency = currentMode === 'buy' ? currency : 'RUB';

            receiveText.innerText = receiveAmount.toFixed(2) + ' ' + receiveCurrency;
            resultBox.style.display = 'block';
            tg.MainButton.show();
        }

        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const amount = document.getElementById('amount').value;
            const currency = document.getElementById('currency').value;
            const receiveAmountText = document.getElementById('receive-text').innerText;
            
            const data = {
                action: currentMode === 'buy' ? 'Покупка' : 'Продажа',
                currency: currency,
                amount_sent: amount,
                amount_received: receiveAmountText
            };
            
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
